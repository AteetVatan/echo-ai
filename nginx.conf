worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    upstream backend {
        server 127.0.0.1:${BACKEND_PORT};
    }

    upstream frontend {
        server 127.0.0.1:3000;
    }

    server {
        listen ${PORT};

        # ── Cold-start loading page ────────────────────────────────
        # Shown when upstreams return 502/503/504 during wake-up.
        # Auto-refreshes every 3s until the real app is ready.
        location @cold_start {
            default_type text/html;
            return 503 '<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="refresh" content="3">
  <title>EchoAI — Starting</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;
         background:#0a0a0f;color:#e2e8f0;font-family:system-ui,-apple-system,sans-serif}
    .container{text-align:center;padding:2rem}
    h1{font-size:2rem;background:linear-gradient(135deg,#6366f1,#a855f7);
       -webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:1rem}
    p{font-size:1.1rem;color:#94a3b8;margin-bottom:2rem}
    .spinner{width:40px;height:40px;margin:0 auto;
             border:3px solid #1e1b4b;border-top-color:#818cf8;
             border-radius:50%;animation:spin 0.8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="container">
    <h1>EchoAI</h1>
    <p>Loading, one moment&hellip;</p>
    <div class="spinner"></div>
  </div>
</body>
</html>';
        }

        # ── Health check — verifies both upstreams are ready ────
        # Railway hits this to decide when to route traffic.
        # Proxies to Next.js → only passes once frontend + backend are up.
        location = /health {
            access_log off;
            proxy_pass http://frontend/api/health-ready;
            proxy_set_header Host $host;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        # ── API routes → Next.js (server-side proxy with auth) ─────
        # Next.js API routes read ECHOAI_API_KEY server-side and proxy
        # to FastAPI. The raw key never reaches the browser.
        location /api/ {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_read_timeout 120s;
        }

        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Deep health (proxied to backend for detailed service status)
        location = /api/health {
            proxy_pass http://backend/health;
            proxy_set_header Host $host;
        }

        location /stats {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        location /docs {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        location /clear-conversation {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Root JSON endpoint from FastAPI
        location = /backend-status {
            proxy_pass http://backend/;
            proxy_set_header Host $host;
        }

        # ── Frontend: everything else ──────────────────────────────
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_intercept_errors on;
            error_page 502 503 504 = @cold_start;
        }

        # Next.js HMR WebSocket (dev only, harmless in prod)
        location /_next/webpack-hmr {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
